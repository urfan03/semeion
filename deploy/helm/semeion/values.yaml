replicaCount: 1

# Horizontal autoscaling. semeion shards live jobs across replicas by a
# consistent-hash ring and transparently forwards a request to the node that
# owns the job, so replicas scale out load and memory. For sharding across
# replicas, give each node its address and its peers via extraArgs, e.g.
#   extraArgs: ["--self=$(POD_IP):8080", "--peers=semeion-0.semeion:8080,..."]
# (a headless Service + stable addresses are the simplest way to supply peers).
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

image:
  repository: ghcr.io/urfan03/semeion
  # Defaults to .Chart.AppVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Seed synthetic demo jobs so the UI has content. Off by default for real
# deployments; the binary's own default is on (for `semeion serve` first-run).
demo: false

# API authentication. The token is a shared secret YOU choose — there is no
# registration or issuing flow. Generate one with `openssl rand -hex 32` and
# give the same value to every client (AccelerUp reads it as SEMEION_TOKEN).
#
# Without it, anyone who can reach the Service has full API access, so leaving
# this off is only reasonable on a cluster-internal ClusterIP with a network
# policy in front of it.
#
# Prefer existingSecret in production: auth.token lands in your values file and
# in Helm's release history, which is usually not where you want a credential.
#   auth:
#     enabled: true
#     existingSecret: semeion-api-token   # managed by Vault / External Secrets
#     secretKey: token
auth:
  enabled: false
  token: ""
  existingSecret: ""
  secretKey: token

# Extra args appended after `serve --addr=:8080`.
extraArgs: []

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: semeion.local
  path: /
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Continuous detection: one `semeion watch` Deployment per job. The job JSON is
# rendered into a ConfigMap; sinks are plain flags.
#
# Note: a watcher keeps its baselines in memory, so a restart re-warms them from
# the lookback window (it does not alert on the warm-up). Mount a PVC and pass
# --state via extraArgs if you need them to survive restarts.
#
#   watchers:
#     - name: checkout-latency
#       job:
#         name: checkout-latency
#         bucket_span: 1m
#         detectors: [{function: mean, field: value, side: high}]
#       source:
#         promUrl: http://prometheus:9090
#         promQuery: 'histogram_quantile(0.95, rate(http_latency_bucket[5m]))'
#       interval: 1m
#       minScore: 60
#       sinks:
#         slackWebhookSecret: {name: semeion-slack, key: url}
#         alertmanager: http://alertmanager:9093
watchers: []

# Optional Python model plane (scipy/statsmodels/prophet). When disabled the Go
# engine uses its built-in provider — every feature still works, just with the
# pure-Go implementations.
modelPlane:
  enabled: false
  replicaCount: 1
  image:
    repository: ghcr.io/urfan03/semeion-model
    tag: ""
    pullPolicy: IfNotPresent
  port: 8899
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
