{{- /*
Rendered only when the chart itself owns the token. Point auth.existingSecret at
a Secret you manage (sealed-secrets, External Secrets, Vault) to keep the value
out of your values file and out of Helm's release history.
*/ -}}
{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
{{- if not .Values.auth.token }}
{{- fail "auth.enabled is set but no token: provide auth.token, or point auth.existingSecret at a Secret you manage" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-auth" (include "semeion.fullname" .) }}
  labels:
    {{- include "semeion.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.secretKey }}: {{ .Values.auth.token | quote }}
{{- end }}
