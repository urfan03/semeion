{{- if .Values.modelPlane.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "semeion.modelPlaneFullname" . }}
  labels:
    {{- include "semeion.labels" . | nindent 4 }}
    app.kubernetes.io/component: model-plane
spec:
  replicas: {{ .Values.modelPlane.replicaCount }}
  selector:
    matchLabels:
      {{- include "semeion.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: model-plane
  template:
    metadata:
      labels:
        {{- include "semeion.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: model-plane
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: model
          image: "{{ .Values.modelPlane.image.repository }}:{{ .Values.modelPlane.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.modelPlane.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.modelPlane.port }}
          env:
            - name: SEMEION_MODEL_PORT
              value: {{ .Values.modelPlane.port | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.modelPlane.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "semeion.modelPlaneFullname" . }}
  labels:
    {{- include "semeion.labels" . | nindent 4 }}
    app.kubernetes.io/component: model-plane
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.modelPlane.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "semeion.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: model-plane
{{- end }}
